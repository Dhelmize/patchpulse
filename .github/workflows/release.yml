name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build Multi-Arch Binaries
        run: |
          mkdir -p dist
          export CGO_ENABLED=0

          echo "Building Windows arm64..."
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/patchpulse-windows-arm64.exe ./cmd/patchpulse

          echo "Building Windows amd64..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/patchpulse-windows-amd64.exe ./cmd/patchpulse

          echo "Building Linux arm64..."
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/patchpulse-linux-arm64 ./cmd/patchpulse

          echo "Building Linux amd64..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/patchpulse-linux-amd64 ./cmd/patchpulse

          echo "Building macOS (Darwin) arm64..."
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/patchpulse-darwin-arm64 ./cmd/patchpulse

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
