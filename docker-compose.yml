version: '3.8'

services:
  patchpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patchpulse
    restart: unless-stopped
    volumes:
      - ./patchpulse-data:/app/data
    environment:
      - DB_DIR=/app/data
    networks:
      - cloudflare_network

networks:
  cloudflare_network:
    external: true
