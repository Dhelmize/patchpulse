version: '3.8'

services:
  patchpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patchpulse
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - DB_DIR=/app/data
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_DEFAULT_BRANCH=${GITHUB_DEFAULT_BRANCH:-main}
      - MEDIAWIKI_API_URL=${MEDIAWIKI_API_URL:-}
      - MEDIAWIKI_USERNAME=${MEDIAWIKI_USERNAME:-}
      - MEDIAWIKI_PASSWORD=${MEDIAWIKI_PASSWORD:-}
      - MEDIAWIKI_API_TOKEN=${MEDIAWIKI_API_TOKEN:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - USER_AGENT=${USER_AGENT:-PatchPulse/1.0}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30000}
      - MAX_RETRIES=${MAX_RETRIES:-3}
    volumes:
      # Persist SQLite database
      - patchpulse-data:/app/data
      # Optional: Mount repo directory for GitHub adapter
      # - ./repos:/app/repos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  patchpulse-data:
    driver: local
